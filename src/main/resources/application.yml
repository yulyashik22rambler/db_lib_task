spring:
  datasource:
    url: jdbc:postgresql://localhost:5433/library
    username: library
    password: library
    hikari:
      maximum-pool-size: 20
  jpa:
    hibernate:
      ddl-auto: validate          # схема управляется Flyway
    open-in-view: false
    properties:
      hibernate:
        default_batch_fetch_size: 50
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true    # для существующих БД
  cache:
    type: caffeine
    caffeine:
      spec: maximumSize=1000,expireAfterWrite=10m

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

springdoc:
  swagger-ui:
    path: /swagger-ui.html