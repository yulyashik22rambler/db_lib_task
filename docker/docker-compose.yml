version: "3.9"

# ============================================================
#  Инфраструктура для проекта Library Management:
#   - PostgreSQL 16      (основная БД)
#   - pgAdmin            (веб-интерфейс к БД)
#   - Prometheus         (сбор метрик Spring Boot Actuator)
#   - Grafana            (визуализация метрик)
# ============================================================

services:

  # -------------------- PostgreSQL --------------------
  postgres:
    image: postgres:16-alpine
    container_name: library-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: library
      POSTGRES_USER: library
      POSTGRES_PASSWORD: library
      PGDATA: /var/lib/postgresql/data/pgdata
      TZ: Europe/Moscow
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # init-скрипты (опционально): выполнятся только при первом создании тома
      # - ./initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U library -d library"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - library-net

  # -------------------- pgAdmin --------------------
#  pgadmin:
#    image: dpage/pgadmin4:latest
#    container_name: library-pgadmin
#    restart: unless-stopped
#    environment:
#      PGADMIN_DEFAULT_EMAIL: admin@library.local
#      PGADMIN_DEFAULT_PASSWORD: admin
#      PGADMIN_CONFIG_SERVER_MODE: "False"
#      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
#    ports:
#      - "5050:80"
#    volumes:
#      - pgadmin_data:/var/lib/pgadmin
#    depends_on:
#      postgres:
#        condition: service_healthy
#    networks:
#      - library-net

  # -------------------- Prometheus --------------------
  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: library-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"
      - "--web.enable-lifecycle"
    extra_hosts:
      # Чтобы Prometheus мог достучаться до Spring Boot на хосте (Linux)
      - "host.docker.internal:host-gateway"
    networks:
      - library-net

  # -------------------- Grafana --------------------
  grafana:
    image: grafana/grafana:11.1.0
    container_name: library-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_INSTALL_PLUGINS: ""
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - library-net

# -------------------- Тома --------------------
volumes:
  postgres_data:
  pgadmin_data:
  prometheus_data:
  grafana_data:

# -------------------- Сети --------------------
networks:
  library-net:
    driver: bridge